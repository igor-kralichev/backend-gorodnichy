name: municipal-low-code-minio

services:
  minio:
    build:
      context: .
      dockerfile: Dockerfile
    image: municipal-low-code-minio:2025-09-07-source
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lowcode}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lowcode-secret}
      TZ: Europe/Moscow
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      platform:
        aliases:
          - minio

volumes:
  minio_data:
    name: municipal_low_code_minio_data

networks:
  platform:
    name: municipal_low_code_network
    external: true
